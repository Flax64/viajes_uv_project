<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajes UV</title>
    <link rel="icon" type="image/webp" href="files/img/logo_viajes_uv.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap"
        rel="stylesheet">
    <link rel="Stylesheet" href="css/main_style.css">
    <!-- Metadatos para compartir en WhatsApp y Redes Sociales (Open Graph) -->
    <meta property="og:title" content="Viajes UV">
    <meta property="og:description" content=" ">
    <meta property="og:image" content="https://flax64.github.io/viajes_uv_project/files/img/logo_viajes_uv.webp">
    <meta property="og:url" content="https://flax64.github.io/viajes_uv_project/">
    <meta property="og:type" content="website">
</head>

<body id="inicio">
    <!-- Encabezado basado en la imagen de referencia -->
    <header class="header">
        <div class="logo-container">
            <img src="files/img/logo_viajes_uv.webp" alt="Logo Viajes UV" class="logo-img" loading="lazy">
            <h1 class="logo-text">Viajes UV</h1>
        </div>
        <nav class="nav">
            <a href="#inicio">Inicio</a>
            <a href="#viajes">Viajes Disponibles</a>
            <a href="https://wa.me/528445512379" target="_blank">Contacto</a>
        </nav>
    </header>

    <!-- Banner Principal -->
    <section class="hero">
        <div class="hero-content">
            <h2>Escapa y viaja con nosotros</h2>
            <p>Desconectate de la rutina y disfruta de una experiencia inolvidable</p>
        </div>
    </section>

    <!-- Sección de Viajes -->
    <main id="viajes" class="destinos-container">
        <h2 class="section-title">Disfruta de cualquiera de nuestros paquetes</h2>
        <!-- AQUÍ JAVASCRIPT INYECTARÁ LAS TARJETAS -->
        <div class="trips-grid" id="contenedor-tarjetas">
            <!-- El contenido se generará dinámicamente -->
            <!-- Estado de carga -->
            <div class="loading-container">
                <div class="spinner"></div>
                <p>Cargando paquetes...</p>
            </div>
        </div>
    </main>
    <!-- VENTANA MODAL DE DETALLES -->
    <div class="modal-overlay" id="modal-detalles">
        <div class="modal-box">
            <!-- Encabezado del Modal -->
            <div class="modal-header">
                <h3 class="modal-title">Detalles del Viaje: Cancún</h3>
                <button class="close-modal">&times;</button>
            </div>

            <!-- Cuerpo del Modal (ESTA ES LA ZONA CON SCROLL) -->
            <div class="modal-body">
                <div id="modal-media"></div> <!-- Aquí va imagen o video -->
                <!-- Contenedores vacíos para inyectar contenido dinámico -->
                <div id="modal-lista-incluye"></div>
                <div id="modal-lugares"></div>
                <div id="modal-pagos"></div>
                <div id="modal-itinerario"></div>
            </div>

            <!-- Pie del Modal -->
            <div class="modal-footer">
                <span class="modal-price"></span>
                <a href="#" target="_blank" class="btn-reservar modal-btn">Reservar por WhatsApp</a>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
